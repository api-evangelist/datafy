note: >-
  Standards and compliance posture, split into two halves. The SECURITY and
  PRIVACY half is real and provider-published (SOC 2 Type II, named auditor, named
  privacy frameworks). The API-STANDARDS half is uniformly false — Datafy's API is
  a bespoke RPC surface with no OpenAPI, no OAuth, no RFC 9457 errors and no
  standard pagination. Both halves are recorded so the profile is not read as
  either better or worse than it is.
conformance:
- id: soc2-type-ii
  conforms: true
  evidence: >-
    "Datafy adheres to the principles of SOC2 Type II, and has successfully
    received the SOC2 Type II Certification from A-Lign" — privacy policy,
    https://www.datafy.com/privacy-policy. Corroborated by the company's own
    announcement, https://www.datafy.com/blog/datafy-completes-soc-2-audit
    (April 2025), which names the auditor as A-LIGN and quotes both Datafy
    co-founder/president Kelby Bosshardt and A-LIGN COO Steve Simmons.
  auditor: A-LIGN
  report_available: false
  report_note: No trust center, no report request portal, and no public bridge
    letter — the claim is published in prose only.
- id: ccpa-cpra
  conforms: true
  evidence: >-
    Privacy policy states adherence to the California Consumer Privacy Act, and
    Datafy publishes an annual CCPA/CPRA request-metrics disclosure at
    https://datafy.com/ccpa-metrics plus a consumer opt-out path at
    https://datafy.com/opt-out (HTTP 200, 2026-08-12).
- id: gdpr
