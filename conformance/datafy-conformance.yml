summary:
  security_and_privacy: strong for the sector — SOC 2 Type II with a named
    auditor, US/EU/UK/Swiss privacy frameworks, and honoured GPC + IAB consent signals
  api_standards: none — the API conforms to no API specification, error, auth, or
    lifecycle standard
