aid: datafy
name: Datafy
description: 'Datafy is a location-analytics and advertising platform, founded in 2018 and headquartered
  in Ogden, Utah, that helps destinations and communities turn visitation, spending, and behavioral
  signals into marketing decisions. It serves travel and tourism boards, attractions, downtowns, retail
  partners, and civic organizations with three core offerings — data analytics, targeted advertising,
  and real-world attribution — alongside Tally, a hardware attendance-measurement sensor. Datafy does
  publish a public API reference at https://www.datafy.com/docs covering the Datafy Data API, a
  self-described beta JSON-over-HTTP reporting API at api.datafy.com with three endpoints (data,
  options, progress), authenticated by a 30-day portal-issued bearer JWT that a customer-experience
  representative must unlock before the API Access page becomes visible. No OpenAPI, SDK, package, or
  self-service signup is published, and the company''s widest developer-touching surface is its
  per-customer measurement tag family — website pixel, 1x1 media impression pixels, and click tags.
  The company reports 500+ clients and holds a SOC 2 Type II certification from A-LIGN.'
