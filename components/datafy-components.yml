hardware:
- name: Tally
  type: physical proximity sensor (not a software component, recorded for completeness)
  url: https://www.datafy.com/tally-implementation
  docs:
  - https://www.datafy.com/tally-implementation/installation
  - https://www.datafy.com/tally-implementation/powering-and-connecting
  - https://www.datafy.com/tally-implementation/troubleshooting
  description: >-
    A 6" x 4" x 2.5" mains-powered device that estimates crowd size from nearby
    smart-device signals within a ~250-foot radius, minute by minute, connecting
    over Wi-Fi or falling back to LTE/5G. Datafy states it collects no PII and
    encrypts data at rest and in transit.
  integration_surface: >-
    Reports are built from the Datafy portal and are "typically ready within 3
    business days" — there is no documented API, callback, or data feed for Tally
    output, so a Tally deployment cannot currently be automated end to end.
