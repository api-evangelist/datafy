note: >-
  Datafy ships no SDK and no UI element library, but it does ship a real
  client-side embed surface — the measurement tags a customer pastes into their
  own website, ad server, or creative. Datafy documents these publicly, at
  length, including installation, verification, troubleshooting and privacy
  guidance. They are the company's primary developer-touching integration point,
  and in practice they matter more to an implementer than the beta Data API does.
  Every tag is PROVISIONED PER CUSTOMER by Datafy ("Your personalized script text
  will go here. Contact us to receive your customized pixel script"), so no
  loader URL, script host, or snippet body is published and none is recorded here
  — the docs show only a placeholder. Nothing below is reconstructed.
distribution:
  model: provider-provisioned snippet
  self_service: false
  public_loader_url: null
  registry: null
  versioned: false
  note: >-
    There is no npm package, no CDN URL, and no version identifier for any Datafy
    tag. A consumer cannot tell what version of the tag they are running, and
    neither can we — the same unpinned-distribution finding that applies to any
    floating script include, made stronger here because the artifact is bespoke
    per program.
families:
- family: Datafy Website Pixel
  url: https://www.datafy.com/pixel/website
  type: JavaScript snippet
  placement: >-
    Between the opening and closing <head> tags on every page and every device
    variant, or via a third-party tag manager. Datafy recommends the global
    header.
  triggers:
  - page load
  - page close
  captures_by_default:
  - session ID
  - timestamp
  - IP address
  - browser and device type
  - traffic acquisition source
  - sessions
  - unique reach
  - attribution metrics
  captures_on_request:
  - on-page conversion events
  - audience segment IDs for campaign retargeting
  cookies: >-
    Attempts to set a cookie to identify a repeat ID for unique-reach
    de-duplication, honouring browser/device privacy settings; Datafy states it
    anticipates phasing cookies out.
  provisioning: request from a customer-experience representative, or via
    https://www.datafy.com/free-pixel-signup
  free_offer:
    url: https://www.datafy.com/free-pixel-signup
    audience: DMOs (destination marketing organizations)
    price: 0
    note: limited-time offer stated on the page
